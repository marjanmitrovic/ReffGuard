name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Write Supabase keepalive row
        env:
          SUPABASE_URL: https://zzugeqlhjwibabomjxdw.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_ANON_KEY repository secret."
            exit 1
          fi

          echo "Writing keepalive row to Supabase..."

          STATUS=$(curl -sS -o /tmp/supabase_keepalive_response.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/keepalive_ping?on_conflict=id" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=representation" \
            --data "[{\"id\":1,\"project\":\"ReffGuard\",\"touched_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]")

          echo "HTTP status: $STATUS"
          cat /tmp/supabase_keepalive_response.txt || true

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Supabase keepalive write failed. Run supabase/keepalive_ping.sql in Supabase SQL Editor and check SUPABASE_ANON_KEY."
            exit 1
          fi

          echo "Supabase keepalive write succeeded."

      - name: Verify via deployed API route
        continue-on-error: true
        run: |
          curl -sS -i "https://reff-guard.vercel.app/api/keepalive" | head -n 40
